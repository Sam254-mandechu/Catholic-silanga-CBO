<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Catholic Silanga CBO">
  <title>Catholic Silanga CBO</title>
  <!-- Background circle (CBO maroon) -->
  <circle cx="32" cy="32" r="30" fill="#841c1b" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#f7efe0" stroke-width="1.5" />

  <!-- Cross -->
  <g transform="translate(32 30)" fill="#f7efe0">
    <rect x="-2.5" y="-12" width="5" height="24" rx="0.5" />
    <rect x="-9" y="-2.5" width="18" height="5" rx="0.5" />
  </g>

  <!-- Dove at the foot of the cross -->
  <g transform="translate(32 49)" fill="#ffffff">
    <circle cx="0" cy="0" r="3.6" />
    <path
      d="M -7.5,0 Q -3.5,-1.8 0,0 Q 3.5,-1.8 7.5,0"
      stroke="#ffffff"
      stroke-width="1.6"
      fill="none"
      stroke-linecap="round"
    />
  </g>
</svg>